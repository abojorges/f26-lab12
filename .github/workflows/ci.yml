name: CI

# Run on every push (any branch) and on every pull request.
on:
  push:
  pull_request:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      # Get the commit being checked onto the runner.
      - uses: actions/checkout@v7

      # Python 3.11 is the floor pyproject.toml promises (requires-python >= 3.11)
      # and the version mypy and ruff are configured to check against.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # The exact pinned tool versions from requirements-dev.txt, same as SETUP.md.
      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      # pyproject.toml sets pythonpath = ["."] and testpaths = ["tests"].
      - name: Run tests
        run: pytest

  # The gate: one job per check, with no `needs:` between them, so they run in
  # parallel and a failure in one cannot hide what the others find.

  ruff:
    name: ruff (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev tools
        run: pip install -r requirements-dev.txt
      # Rules come from [tool.ruff] in pyproject.toml (E4, E7, E9, F, B).
      - name: Lint
        run: ruff check .

  mypy:
    name: mypy (types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev tools
        run: pip install -r requirements-dev.txt
      # Files and Python version come from [tool.mypy] in pyproject.toml.
      - name: Type-check
        run: mypy

  audit:
    name: pip-audit (dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev tools
        run: pip install -r requirements-dev.txt
      # Checks the pinned runtime versions against published vulnerability reports.
      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt
